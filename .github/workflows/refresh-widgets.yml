name: Refresh weather and hot search

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-widgets.yml'
      - 'scripts/refresh-widgets.mjs'

permissions:
  contents: write

concurrency:
  group: refresh-widgets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate updater
        run: node --test tests/widgets.test.mjs
      - name: Fetch public snapshots
        env:
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ vars.QWEATHER_API_HOST }}
          QWEATHER_LOCATION: ${{ vars.QWEATHER_LOCATION }}
          QWEATHER_CITY_NAME: ${{ vars.QWEATHER_CITY_NAME }}
          QWEATHER_PROVINCE_NAME: ${{ vars.QWEATHER_PROVINCE_NAME }}
        run: node scripts/refresh-widgets.mjs
      - name: Commit data only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weather.json data/hot-search.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh weather and hot search snapshots'
          # Rebase if a device saved navigation during the fetch; never force push.
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
