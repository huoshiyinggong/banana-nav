name: Cache navigation icons

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sites.json', 'scripts/cache-icons.mjs', '.github/workflows/cache-icons.yml']

permissions:
  contents: write

concurrency:
  group: cache-navigation-icons
  cancel-in-progress: false

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/icon-assets.test.mjs
      - run: node scripts/cache-icons.mjs
      - name: Save images without changing navigation data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site-icons data/icon-assets.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Cache navigation icon image files'
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
